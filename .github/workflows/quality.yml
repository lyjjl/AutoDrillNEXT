name: Quality

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Test and package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;37.0.0"
          echo "${ANDROID_HOME}/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Test and package the mod
        run: |
          chmod +x gradlew
          ./gradlew test deploy --no-daemon

      - name: Verify release artifact
        run: |
          test -f build/libs/AutoDrillNEXT.jar
          python3 - <<'PY'
          from zipfile import ZipFile

          with ZipFile("build/libs/AutoDrillNEXT.jar") as package:
              entries = set(package.namelist())

          required = {"LICENSE", "mod.hjson", "icon.png", "autodrillnext/AutoDrillNEXT.class", "classes.dex"}
          missing = required - entries
          if missing:
              raise SystemExit(f"Missing required package entries: {sorted(missing)}")
          PY

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDrillNEXT
          path: build/libs/AutoDrillNEXT.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 14
